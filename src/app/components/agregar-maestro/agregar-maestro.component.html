<app-navbar></app-navbar>
<div class="agregar-maestro-container">
  <form (ngSubmit)="onSubmit()">
    <div class="form-grid">
      <div class="form-group">
        <label for="nombre">Nombre</label>
        <input
          type="text"
          id="nombre"
          [(ngModel)]="maestro.nombre"
          name="nombre"
          required
        />
      </div>
      <div class="form-group">
        <label for="apellido">Apellidos</label>
        <input
          type="text"
          id="apellido"
          [(ngModel)]="maestro.apellido"
          name="apellido"
          required
        />
      </div>
      <div class="form-group">
        <label for="NombreMaestro">Nombre Maestro</label>
        <input
          type="text"
          id="NombreMaestro"
          [(ngModel)]="maestro.NombreMaestro"
          name="NombreMaestro"
          required
        />
      </div>

      <div class="form-group">
        <label for="correo">Correo <i class="fa-solid fa-at"style="margin-left: 5px;"></i></label>
        <input
          type="email"
          id="correo"
          [(ngModel)]="maestro.correo"
          name="correo"
          required
        />
      </div>
      <div class="form-group">
        <label for="cedula">Número de Documento <i class="fa-solid fa-id-card" style="margin-left: 10px;"></i> </label>
        <input
          type="text"
          id="cedula"
          [(ngModel)]="maestro.cedula"
          name="cedula"
          required
        />
      </div>
      <div class="form-group">
        
        <label for="region">Región de operación<i class="fa-solid fa-map-location"style="margin-left: 10px;"></i></label>
        <select
          id="region"
          [(ngModel)]="maestro.region"
          name="region"
          required
        >
          <option value="" disabled selected>Seleccione una región</option>
          <option value="Chile">Chile</option>
          <option value="Ecuador">Ecuador</option>
          <option value="Perú">Perú</option>
          <option value="Bolivia">Bolivia</option>
          <option value="México">México</option>
          <option value="España">España</option>
          <option value="Colombia">Colombia</option>
        </select>
      </div>
      <div class="form-group">
        <label for="marca">Marca Celular <i class="fa-solid fa-mobile"></i></label>
        <input
          type="text"
          id="marca"
          [(ngModel)]="maestro.marca"
          name="marca"
        />
      </div>
      <div class="form-group">
        <label for="modelo">Modelo Celular</label>
        <input
          type="text"
          id="modelo"
          [(ngModel)]="maestro.modelo"
          name="modelo"
        />
      </div>
      <div class="form-group full-width">
        <label for="descripcion">Descripción</label>
        <textarea
          id="descripcion"
          [(ngModel)]="maestro.descripcion"
          name="descripcion"
          required
        ></textarea>
      </div>
      <div class="form-group full-width">
        <label for="firma">Firma <i class="fa-solid fa-signature"style="margin-left: 10px;"></i></label>
        <signature-pad
          #signature
          [options]="signaturePadOptions"
          (drawStart)="drawStart($event)"
          (drawEnd)="drawComplete($event)"
          class="signature-pad"
        >
        </signature-pad>
      </div>
    </div>
    <div class="btn-container">
      <button type="button" class="btn-limpiar" (click)="undo()">
        Limpiar Firma <i class="fa-solid fa-delete-left"style="margin-left: 5px;"></i>
      </button>
      <button type="submit" class="btn-agregar">Agregar Maestro  <i class="fa-solid fa-user-plus"style="margin-left: 10px;"></i> </button>
    </div>
  </form>
  <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
  </div>
  <div *ngIf="successMessage" class="success-message">
    {{ successMessage }}
  </div>
  <button type="button" class="btn-cancelar" (click)="navigateToDashboard()">
    Cancelar <i class="fa-solid fa-xmark"style="margin-left: 10px;"></i>
  </button> 
  <app-spinner *ngIf="loading"></app-spinner>

</div>
