<app-navbar></app-navbar>
<div class="container">
  <h2>📱 Entrega de Celular</h2>
  <p class="subtitle">Complete los datos para registrar la entrega del celular</p>
  
  <form (ngSubmit)="onSubmit()">
    
    <!-- Selección de Celular -->
    <div class="form-group">
      <label for="celular">
        📱 Celular
      </label>
      <select id="celular" (change)="onCelularChange($event)" name="celular" required>
        <option value="" disabled selected>Seleccione un Celular</option>
        <option *ngFor="let celular of celularesDisponibles" [value]="celular.Mid">
          {{ celular.marca }} {{ celular.modelo }} - IMEI: {{ celular.imei }}
        </option>
      </select>
    </div>

    <!-- Información del Celular Seleccionado (Read-only) -->
    <div *ngIf="celularSeleccionado" class="info-celular">
      <div class="row">
        <div class="form-group">
          <label>Marca Celular</label>
          <input type="text" [value]="celularSeleccionado.marca" readonly />
        </div>
        <div class="form-group">
          <label>Modelo Celular</label>
          <input type="text" [value]="celularSeleccionado.modelo" readonly />
        </div>
      </div>
      
      <div class="form-group">
        <label>📱 IMEI</label>
        <input type="text" [value]="celularSeleccionado.imei" readonly />
      </div>
    </div>

    <!-- Nombre de la Analista -->
    <div class="form-group">
      <label for="analista">
        👤 Nombre de la Analista
      </label>
      <select id="analista" (change)="onAnalistaChange($event)" name="analista" required>
        <option value="" disabled selected>Seleccione una Analista</option>
        <option *ngFor="let analista of analistas" [value]="analista.nombre">
          {{ analista.nombre }}
        </option>
      </select>
    </div>

    <!-- Región de Operación / Almacén -->
    <div class="form-group">
      <label for="almacen">
        📍 Región de Operación
      </label>
      <select id="almacen" [(ngModel)]="maestro.almacen" name="almacen" required>
        <option value="Principal">Principal</option>
        <option value="Secundario">Secundario</option>
        <option value="Norte">Norte</option>
        <option value="Sur">Sur</option>
        <option value="Oriente">Oriente</option>
        <option value="Occidente">Occidente</option>
      </select>
    </div>

    <!-- Campo Descripción -->
    <div class="form-group">
      <label for="descripcionEntrega">
        📝 Descripción
      </label>
      <textarea 
        id="descripcionEntrega" 
        [(ngModel)]="maestro.descripcionEntrega" 
        name="descripcionEntrega" 
        placeholder="Describa el estado del celular o información adicional..."
        required>
      </textarea>
    </div>

    <!-- Área de Firma -->
    <div class="form-group full-width signature-container">
      <label for="firmaEntrega">
        ✍️ Firma de Entrega
      </label>
      <div class="signature-wrapper">
        <canvas #signaturePad class="signature-pad"></canvas>
        <p class="signature-help">Firme dentro del recuadro</p>
      </div>
    </div>

    <!-- Botones -->
    <div class="btn-container">
      <button type="button" class="btn-limpiar" (click)="undo()">
        🗑️ Limpiar Firma
      </button>
      <button type="submit" class="btn-agregar">
        📤 Entregar Celular
      </button>
    </div>
  </form>

  <!-- Mensajes -->
  <div *ngIf="errorMessage" class="error-message">
    ❌ {{ errorMessage }}
  </div>
  <div *ngIf="successMessage" class="success-message">
    ✅ {{ successMessage }}
  </div>

  <!-- Botón Cancelar -->
  <button type="button" class="btn-cancelar" (click)="navigateToDashboard()">
    ❌ Cancelar
  </button>

  <!-- Spinner de carga -->
  <app-spinner *ngIf="loading"></app-spinner>
</div>
