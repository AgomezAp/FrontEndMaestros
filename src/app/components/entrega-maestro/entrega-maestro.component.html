<app-navbar></app-navbar>
<div class="container">
  <h2>Recibir Celular</h2>
  <form (ngSubmit)="onSubmit()">
    <!-- Campo Monitor -->
    <div class="form-group">
      <label for="nombre">
        Monitor 
        <i class="fa-solid fa-map-location" style="margin-left: 10px"></i>
      </label>
      <select id="nombre" [(ngModel)]="maestro.maestroRecibido" name="nombre" required>
        <option value="" disabled selected>Seleccione un Monitor</option>
        <option value="Luisa-rodriguez">Luisa Rodriguez</option>
        <option value="Carmen">Carmen</option>
        <option value="Roxana">Roxana</option>
        <option value="Oswaldo">Oswaldo</option>
        <option value="Luis-enrique">Luis Enrique</option>
        <option value="Macaco">Macaco</option>
        <option value="Henyer">Henyer</option>
        <option value="Jean-carlos">Jean Carlos</option>
        <option value="Feliz">Feliz</option>
        <option value="Biter">Biter</option>
        <option value="Tarot">Tarot</option>
        <option value="Oficina">Oficina</option>
      </select>
    </div>

    <!-- Campo Descripción -->
    <div class="form-group">
      <label for="descripcionRecibe">Descripción:</label>
      <textarea id="descripcionRecibe" [(ngModel)]="maestro.descripcionRecibe" name="descripcionRecibe" required></textarea>
    </div>

    <!-- Área de Firma -->
    <div class="form-group full-width signature-container">
      <label for="firmaEntrega">
        Firma 
        <i class="fa-solid fa-signature" style="margin-left: 10px"></i>
      </label>
      <signature-pad
        #signature
        (drawStart)="drawStart($event)"
        (drawEnd)="drawComplete($event)"
        class="signature-pad">
      </signature-pad>
    </div>

    <!-- Botones -->
    <div class="btn-container">
      <button type="button" class="btn-limpiar" (click)="undo()">
        Limpiar Firma 
        <i class="fa-solid fa-delete-left" style="margin-left: 5px"></i>
      </button>
      <button type="submit" class="btn-agregar">
        Entregar Celular 
        <i class="fa-solid fa-user-plus" style="margin-left: 10px"></i>
      </button>
    </div>
  </form>

  <!-- Mensajes -->
  <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
  </div>
  <div *ngIf="successMessage" class="success-message">
    {{ successMessage }}
  </div>

  <!-- Botón Cancelar -->
  <button type="button" class="btn-cancelar" (click)="navigateToDashboard()">
    Cancelar 
    <i class="fa-solid fa-xmark" style="margin-left: 10px"></i>
  </button>

  <!-- Spinner de carga -->
  <app-spinner *ngIf="loading"></app-spinner>
</div>
